name: container
on:
  push:
    branches: [main]
    paths: ['catalog/**', 'cmd/**', 'internal/**', 'go.mod', 'go.sum', 'deploy/docker/**', '.github/workflows/container.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nano112/gerrymander:sha-${{ github.sha }}
          build-args: VERSION=main-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Nano112/gerrymander
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
