name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerry_catalog_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race ./internal/store -run TestCatalog -count=1
        env:
          GERRY_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/gerry_catalog_test?sslmode=disable
  vite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/vite/package-lock.json
      - run: npm ci
      - run: npm test
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/laravel
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/catalog.php
