services:
  gerry:
    image: gerrymander:dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
      - '127.0.0.1:5173:5173'
      - '127.0.0.1:5174:5174'
      - '127.0.0.1:5175:5175'
      - '127.0.0.1:5176:5176'
      - '127.0.0.1:4780:4780'
      # tailnet exposure: proxy + dev DNS reachable from peers, loopback
      # bindings above stay untouched (dnsmasq keeps local .test)
      - '100.103.181.67:443:443'
      # registry API on the tailnet: keyless by design here — every device
      # on this personal tailnet may claim/release. Revisit if the tailnet
      # ever gains other users.
      - '100.103.181.67:4780:4780'
      - '100.103.181.67:53:5353/udp'
      - '100.103.181.67:53:5353/tcp'
    volumes:
      - './gerry.yaml:/etc/gerry.yaml:ro'
      - './data:/data'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - dev-proxy

networks:
  dev-proxy:
    external: true
