{{- if .Values.ingressRoute.enabled }}
# NOTE for estates with a low-priority tenant catch-all (HostRegexp at
# priority 1): bare-Host routes must carry a HIGHER priority or ties lose
# traffic non-deterministically — the failure mode gerry's shadow check
# exists to catch.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints: {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ .Values.ingressRoute.host }}`)
      kind: Rule
      priority: {{ .Values.ingressRoute.priority }}
      services:
        - { name: {{ .Release.Name }}, port: {{ .Values.service.port }} }
{{- end }}
