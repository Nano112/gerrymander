apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: {{ .Release.Name }} }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gerry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/gerry/gerry.yaml"]
          ports:
            - { containerPort: {{ .Values.service.port }}, name: api }
            - { containerPort: {{ .Values.service.metricsPort }}, name: metrics }
          env:
            - name: GERRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.apiKeySecret.name }}
                  key: {{ .Values.apiKeySecret.key }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/gerry }
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.service.port }} }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.service.port }} }
            initialDelaySeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-data }
        - name: config
          configMap: { name: {{ .Release.Name }}-config }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }} # ServiceMonitor selectors match SERVICE labels
spec:
  selector: { app: {{ .Release.Name }} }
  ports:
    - { port: {{ .Values.service.port }}, targetPort: {{ .Values.service.port }}, name: api }
    - { port: {{ .Values.service.metricsPort }}, targetPort: {{ .Values.service.metricsPort }}, name: metrics }
