# Two hostnames, one project. `gerry up` creates the zone if it doesn't
# exist, claims both hostnames, grants each service a sticky port from the
# dev pool, and routes the proxy at them. The dev servers themselves run on
# the host (see dev.sh); the proxy reaches them via host.docker.internal
# because the local gerry daemon runs in a container.
project: coolwebsite
zone: coolwebsite.test
services:
  frontend:
    hostnames: [coolwebsite.test]
    port_pool: dev
    # `gerry dev` with no argument runs every dev: service together,
    # procfile-style. The vite plugin still does the claiming/config.
    dev: cd frontend && bun run dev
  api:
    hostnames: [backend.coolwebsite.test]
    port_pool: dev
    # `gerry dev api` (from this directory) applies the manifest, grants
    # the sticky port, and runs this — python set-and-forget.
    dev: cd backend && uv run uvicorn main:app --host 127.0.0.1 --port {PORT} --reload
